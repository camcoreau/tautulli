name: CamCore Tautulli Image

on:
  push:
    branches:
      - master
      - 'agent/**'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camcore-tautulli-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/camcoreau/tautulli
  AUDIT_IMAGE_NAME: ghcr.io/camcoreau/cma-account-audit

jobs:
  validate:
    name: Validate CamCore downstream
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Python patch scripts
        run: |
          python3 -m py_compile \
            camcore-branding/apply_branding.py \
            camcore-branding/apply_streaming_newsletter.py \
            camcore-branding/apply_notifications.py

      - name: Apply notification patch to upstream source
        env:
          CAMCORE_TAUTULLI_ROOT: ${{ github.workspace }}
        run: |
          python3 camcore-branding/apply_notifications.py
          python3 -m py_compile \
            plexpy/notifiers.py \
            plexpy/newsletters.py \
            plexpy/notification_handler.py

      - name: Verify CamCore notification standards
        run: |
          grep -F "Insights | CamCore Media" plexpy/notifiers.py
          grep -F "Updates | CamCore Media" plexpy/newsletters.py
          grep -F "Cameron-Media is unavailable" plexpy/notifiers.py
          grep -F "What's new on Cameron-Media" plexpy/newsletters.py
          grep -F "CAMCORE MEDIA • INSIGHTS" plexpy/notifiers.py

      - name: Prepare exact CamCore artwork for image validation
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          cat camcore-branding/dark-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-dark.png

          cat camcore-branding/light-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-light.png

          echo "58d436201eff1ed379c8f3a1bfb818ef403fee75d188a8a6d478df65646232af  camcore-branding/camcore-logo-dark.png" | sha256sum --check
          echo "9a8f29b247fcdfd670c58f48b7aa760e157fa8e042b8f8ffd9164c1bfa03fff0  camcore-branding/camcore-logo-light.png" | sha256sum --check

      - name: Build CamCore image without publishing
        if: github.ref != 'refs/heads/master'
        run: docker build --pull --file Dockerfile.camcore --tag camcore-tautulli:validation .

      - name: Build CMA account audit image without publishing
        if: github.ref != 'refs/heads/master'
        run: docker build --pull --file camcore-account-audit/Dockerfile --tag cma-account-audit:validation camcore-account-audit

      - name: Validate Cameron-Media account audit
        run: |
          python3 -m py_compile camcore-account-audit/audit.py
          python3 -m unittest discover -s camcore-account-audit/tests -v
          python3 -m json.tool youtrack-app/cma-account-audit/manifest.json > /dev/null
          python3 -m json.tool youtrack-app/cma-account-audit/entity-extensions.json > /dev/null
          python3 -m json.tool youtrack-workflows/cma-account-review/manifest.json > /dev/null
          python3 -m json.tool youtrack-workflows/cma-account-review/entity-extensions.json > /dev/null
          python3 -m json.tool youtrack-workflows/camcore-due-date-notifications/manifest.json > /dev/null
          node --check youtrack-app/cma-account-audit/account-sync.js
          node youtrack-app/cma-account-audit/tests/test-account-sync.js
          node --check youtrack-workflows/cma-account-review/lifecycle-transitions.js
          node --check youtrack-workflows/cma-account-review/notice-escalation.js
          node --check youtrack-workflows/cma-account-review/deadline-transitions.js
          node --check youtrack-workflows/cma-account-review/communications.js
          node --check youtrack-workflows/cma-account-review/stage-communications.js
          node --check youtrack-workflows/cma-account-review/lifecycle-catchup.js
          node --check youtrack-workflows/cma-account-review/communication-catchup.js
          node --check youtrack-workflows/cma-account-review/audit-freshness-bridge.js
          node --check youtrack-workflows/cma-account-review/reporter-replies.js
          node --check youtrack-workflows/camcore-due-date-notifications/overdue-notifications.js
          node youtrack-workflows/cma-account-review/tests/test-communications.js
          node youtrack-workflows/cma-account-review/tests/test-reporter-replies.js
          node youtrack-workflows/cma-account-review/tests/test-lifecycle-transitions.js
          node youtrack-workflows/cma-account-review/tests/test-lifecycle-catchup.js
          node youtrack-workflows/cma-account-review/tests/test-communication-rules.js
          node youtrack-workflows/cma-account-review/tests/test-audit-freshness-bridge.js
          node youtrack-workflows/cma-account-review/tests/test-deadline-safety.js
          node youtrack-workflows/cma-account-review/tests/test-incident-regression.js
          node youtrack-workflows/camcore-due-date-notifications/tests/test-overdue-notifications.js

      - name: Build exact CMA YouTrack upload packages
        run: |
          python3 .github/scripts/package_cma_workflow.py
          python3 .github/scripts/package_cma_account_audit.py
          python3 -m zipfile --list dist/cma-account-review.zip
          python3 -m zipfile --list dist/cma-account-audit.zip
          sha256sum dist/cma-account-review.zip dist/cma-account-audit.zip

      - name: Publish reviewed CMA workflow package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cma-account-review-workflow
          path: dist/cma-account-review.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish reviewed CMA account-audit app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cma-account-audit-app
          path: dist/cma-account-audit.zip
          if-no-files-found: error
          retention-days: 30

  build-and-publish:
    name: Build and publish AMD64 image
    if: github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare exact CamCore artwork
        shell: bash
        run: |
          set -euo pipefail

          cat camcore-branding/dark-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-dark.png

          cat camcore-branding/light-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-light.png

          echo "58d436201eff1ed379c8f3a1bfb818ef403fee75d188a8a6d478df65646232af  camcore-branding/camcore-logo-dark.png" | sha256sum --check
          echo "9a8f29b247fcdfd670c58f48b7aa760e157fa8e042b8f8ffd9164c1bfa03fff0  camcore-branding/camcore-logo-light.png" | sha256sum --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=camcore
            type=sha,prefix=master-
          labels: |
            org.opencontainers.image.title=CamCore Media Insights
            org.opencontainers.image.description=CamCore-branded Tautulli monitoring, analytics, notifications and newsletters for Cameron-Media
            org.opencontainers.image.source=https://github.com/camcoreau/tautulli

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.camcore
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=camcore-tautulli-amd64
          cache-to: type=gha,mode=max,scope=camcore-tautulli-amd64
          provenance: false

  build-and-publish-account-audit:
    name: Build and publish CMA account audit image
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/agent/cma-account-audit'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate audit image metadata
        id: audit-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.AUDIT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=master-,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=candidate-,enable=${{ github.ref == 'refs/heads/agent/cma-account-audit' }}
          labels: |
            org.opencontainers.image.title=Cameron-Media Account Audit
            org.opencontainers.image.description=Daily Tautulli to CMA YouTrack account review synchronization
            org.opencontainers.image.source=https://github.com/camcoreau/tautulli

      - name: Build and publish audit image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./camcore-account-audit
          file: ./camcore-account-audit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.audit-meta.outputs.tags }}
          labels: ${{ steps.audit-meta.outputs.labels }}
          cache-from: type=gha,scope=cma-account-audit-amd64
          cache-to: type=gha,mode=max,scope=cma-account-audit-amd64
          provenance: false
