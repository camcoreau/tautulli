name: Build CamCore Tautulli image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: camcore-tautulli-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tautulli

jobs:
  build:
    name: Build and publish CamCore image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare exact CamCore artwork
        shell: bash
        run: |
          set -euo pipefail

          cat camcore-branding/dark-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-dark.png

          cat camcore-branding/light-logo.b64.* \
            | tr -d '\r\n' \
            | base64 --decode \
            > camcore-branding/camcore-logo-light.png

          echo "58d436201eff1ed379c8f3a1bfb818ef403fee75d188a8a6d478df65646232af  camcore-branding/camcore-logo-dark.png" | sha256sum --check
          echo "9a8f29b247fcdfd670c58f48b7aa760e157fa8e042b8f8ffd9164c1bfa03fff0  camcore-branding/camcore-logo-light.png" | sha256sum --check

          curl --retry 3 --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/camcoreau/Seerr/develop/public/os_icon.svg" \
            --output camcore-branding/camcore-icon.svg

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.camcore
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max