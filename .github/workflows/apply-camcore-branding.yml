name: Apply CamCore repository branding

on:
  push:
    branches:
      - branding/camcore-logo-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branding branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply current CamCore branding
        shell: bash
        env:
          BRANDING_SOURCE_SHA: 9a9155b5d60c99e8e3390045ad25c71bc824673e
        run: |
          mkdir -p .github/brand
          curl -fsSL "https://raw.githubusercontent.com/camcoreau/bazarr/${BRANDING_SOURCE_SHA}/.github/brand/camcore-repository-banner.svg" \
            -o .github/brand/camcore-repository-banner.svg
          curl -fsSL "https://raw.githubusercontent.com/camcoreau/bazarr/${BRANDING_SOURCE_SHA}/.github/brand/apply.py" \
            -o /tmp/apply-camcore-branding.py
          python3 /tmp/apply-camcore-branding.py

      - name: Commit repository branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/brand/camcore-repository-banner.svg
          for file in README.md readme.md README.MD; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No branding change to commit"
            exit 0
          fi
          git commit -m "Adopt the current CamCore repository logo"
          git push origin "HEAD:${GITHUB_REF_NAME}"
