services:
  cma-account-audit:
    image: ${CMA_ACCOUNT_AUDIT_IMAGE:?set an immutable master-sha image tag}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TAUTULLI_URL: http://tautulli:8181
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY}
      YOUTRACK_URL: https://support.camcore.au
      YOUTRACK_PROJECT_ID: CMA
      YOUTRACK_TOKEN: ${YOUTRACK_TOKEN}
      # OPS-271: reporter provisioning is parked. YOUTRACK_REPORTER_PROVISION_TOKEN
      # and YOUTRACK_HUB_URL are deliberately absent - supplying the token to a
      # parked build makes the worker exit 2 at startup. See REPORTER_PROVISIONING.md.
      INACTIVE_DAYS: "60"
      NEVER_USED_DAYS: "14"
      EXCLUDED_USERS: Guest,Local
      REGISTRY_PATH: /data/registry.json
      DRY_RUN: "true"
      AUDIT_INTERVAL_SECONDS: "86400"
    volumes:
      - cma-account-audit-data:/data
    networks:
      - default

volumes:
  cma-account-audit-data:
